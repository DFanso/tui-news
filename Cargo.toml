[package]
name = "tui-news"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A keyboard-first RSS/Atom news reader for the terminal"
license = "MIT"
repository = "https://github.com/DFanso/tui-news"
homepage = "https://github.com/DFanso/tui-news"
readme = "README.md"
keywords = ["rss", "atom", "tui", "news", "feed"]
categories = ["command-line-utilities"]
authors = ["Leo Felcianas <leogavin123@outlook.com>"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
feed-rs = "2.4.0"
futures = "0.3.34"
html2text = "0.17.1"
open = "5.4.2"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29", "macros", "underline-color", "layout-cache"] }
reqwest = "0.13.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
fontdue = "0.9.3"
image = "0.25.9"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
